services:
  # FastAPI Backend Service (Frontend is deployed separately on Vercel)
  - type: web
    name: adaptai-backend
    runtime: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false # Paste your Supabase PostgreSQL connection string
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true # Render will auto-generate a secure random 32-char key
      # Real AI Provider (NVIDIA NIM Free API)
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false # Paste your free key from build.nvidia.com
      - key: NVIDIA_MODEL
        value: meta/llama-3.3-70b-instruct
      # Voice & Media Providers (Browser speech + YouTube video embeds)
      - key: TTS_PROVIDER
        value: browser # Voice clues spoken in student browser (Web Speech API with en-IN Indian English)
      - key: STT_PROVIDER
        value: fake # Free fallback (avoids paid transcription APIs)
      - key: VIDEO_PROVIDER
        value: fake # Free fallback (courses use YouTube embed URLs, avoiding paid AWS S3 video buckets)
