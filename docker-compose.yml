version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: adaptai-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adaptai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adaptai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adaptai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/adaptai
      DATABASE_SYNC_URL: postgresql://postgres:postgres@db:5432/adaptai
      ENVIRONMENT: development
      DEBUG: "true"
      PORT: "8000"
      HOST: "0.0.0.0"
      LLM_PROVIDER: "fake"
      TTS_PROVIDER: "fake"
      STT_PROVIDER: "fake"
      VIDEO_PROVIDER: "fake"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adaptai-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/api/v1/ws

volumes:
  postgres_data:
  uploads_data:
